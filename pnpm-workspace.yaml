packages:
  - 'packages/*'
  - 'apps/*'

# esbuild ships a prebuilt binary that its postinstall script unpacks; tsx needs it.
# @parcel/watcher is the Tailwind CLI's file watcher, used only by `--watch`,
# which no script here passes; its prebuilt binaries need no install script.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true

# @fedify/fedify pins @opentelemetry/sdk-metrics 2.7.1, which pins
# @opentelemetry/core 2.7.1 (GHSA-8988-4f7v-96qf). Drop this once Fedify
# depends on a patched sdk-metrics.
overrides:
  '@opentelemetry/core@2.7.1': '^2.8.0'
