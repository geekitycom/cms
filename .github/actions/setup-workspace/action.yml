# The steps every CI job runs after checking out, in one place so a new job is a
# `uses:` line rather than another copy of the setup. The checkout itself stays
# in the caller: a local action cannot run until the repository holding it is on
# disk.
#
# `pnpm/action-setup` is deliberately given no `version`: it reads the
# `packageManager` field in the root package.json, so the pinned pnpm is the one
# CI uses and there is only one place to bump it. It has to run before
# `setup-node`, because `cache: pnpm` shells out to `pnpm store path`.
name: Set up the workspace
description: Installs the pinned pnpm and the requested Node, then runs a frozen install.

inputs:
  node-version:
    description: Node version to install. `22` resolves to the latest 22.x.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    # The root `prepare` script is `husky && pnpm build`. husky is happy in a
    # checkout that has a .git directory, but CI has no hooks to install, so
    # HUSKY=0 makes it exit early. The `pnpm build` half still runs, which is
    # why `dist/` exists in every job without a separate build step.
    - name: Install dependencies
      shell: bash
      env:
        HUSKY: '0'
      run: pnpm install --frozen-lockfile
