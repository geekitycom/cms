# Weekly dependency updates, grouped so a quiet week is one pull request rather
# than a dozen.
#
# The commit prefixes matter: commitlint and the `pr-title` CI job only accept
# the scopes listed in `commitlint.config.js`, so Dependabot has to open pull
# requests titled `chore(deps): …` and `ci(deps): …` or its own pull requests
# would fail the title check.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      # Everything the workspace depends on, in one pull request. Major bumps
      # are separated out because they are the ones that need reading.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
