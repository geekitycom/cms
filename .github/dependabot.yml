# Weekly dependency updates, grouped so a quiet week is one pull request rather
# than a dozen.
#
# The commit prefixes matter: release-please reads the squash-merged title, so
# Dependabot has to open pull requests titled `chore(deps): …` and
# `ci(deps): …` with a scope from `commitlint.config.js`. The `pr-title` CI job
# skips pull requests labelled `dependencies`, because Dependabot capitalises
# "Bump" and offers no way not to.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      # Everything the workspace depends on, in one pull request. Major bumps
      # are separated out because they are the ones that need reading.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
