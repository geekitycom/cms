# Weekly dependency updates, grouped so a quiet week is one pull request rather
# than a dozen.
#
# The commit prefixes matter: pull requests land as merge commits and
# release-please reads the commits on the branch, so Dependabot has to write
# `chore(deps): …` and `ci(deps): …` commits with a scope from
# `commitlint.config.js`.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      # Everything the workspace depends on, in one pull request. Major bumps
      # are separated out because they are the ones that need reading.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
