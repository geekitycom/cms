# The quality gates of decision-8, one job per gate so each can be named as a
# required status check on `main`: lint, typecheck, test and build.
#
# `pnpm install` runs the root `prepare` script, which builds `packages/cms`, so
# every job already has `dist/` before its own command runs. The `build` job is
# still here on its own: it is the check a branch protection rule points at, and
# it is the one that fails loudly when the compiler is the problem.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request run tests GitHub's merge of the branch into main as main
  # stood then, so a push whose merge commit has the same tree was already
  # tested byte for byte. So was a pull request run whose merge has the same
  # tree, as when a stacked pull request is rebased onto main after the one
  # below it merges. [skip ci] cannot do this: it would skip release-please
  # too.
  already-tested:
    name: already-tested
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.look.outputs.skip }}
    steps:
      - id: look
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # A fork's pull request runs its own copy of this workflow, so only an
        # artifact from a run of this repository's own branches counts.
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tested-tree-$tree&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | length')
          echo "tree $tree was tested by $found earlier run(s)"
          if [ "$found" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  lint:
    name: lint
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint
      # Formatting is a check, not a fixup: CI never rewrites files, it fails
      # and leaves `pnpm format` to the author.
      - run: pnpm format:check

  typecheck:
    name: typecheck
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  # The suite is CPU-bound and `node --test` runs one file per process with a
  # concurrency of cores minus one, so on the four vCPUs a standard
  # GitHub-hosted runner gives a public repository, three files run at once.
  test:
    name: test
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test

  # The package's floor is Node 24, the active LTS, which is what `test` runs
  # on. This job runs the same suite on the current line so the next LTS holds
  # no surprises. A separate job rather than a matrix so the check above keeps
  # the plain name `test`.
  test-node-26:
    name: test-node-26
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: '26'
      - run: pnpm test

  build:
    name: build
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build

  # The Eleventy compatibility suite spins up a real Eleventy build, so it is
  # its own job and the fast suite stays fast (decision-8).
  test-11ty:
    name: test-11ty
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:11ty

  # Federation against something other than ourselves. The suite covers the
  # ActivityPub layer inside one process — `src/federation/delivery.test.ts`
  # replaces `fetch`, so a follower's inbox is a function call — and this boots
  # the server on a real port, runs `fedify lookup` from `@fedify/cli` against
  # the actor and a post object, and delivers a `Create` to two real inboxes.
  #
  # A job of its own because it spawns processes and binds ports, and because a
  # federation failure should be readable as a federation failure rather than
  # as one line in `test`. It needs no network: everything it talks to is on
  # loopback, and `@fedify/cli` comes out of the lockfile.
  fed-smoke:
    name: fed-smoke
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm fed:smoke

  # The published artefact rather than the workspace link (decision-6). Every
  # other job reaches `@geekity/cms` through a symlink, which shows the whole
  # source tree whether or not `files` in package.json would have shipped it;
  # this one packs a tarball, scaffolds a site with `geekity init`, installs the
  # tarball into it and asks the booted site for three URLs.
  #
  # The steps live in `scripts/pack-install-smoke.sh` rather than in this file,
  # so the sequence can be run on a laptop before it is trusted here.
  pack-install:
    name: pack-install
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Pack, install into a scratch site and boot it
        shell: bash
        # $RUNNER_TEMP is outside the checkout, so the scratch site's own
        # install cannot see this repository's workspace.
        run: bash scripts/pack-install-smoke.sh "$RUNNER_TEMP"

  # The Docker image. It is published by hand with scripts/docker-build-push.sh,
  # so without this a broken Dockerfile would surface only at release time on a
  # maintainer's workstation. The image is built for linux/amd64 and loaded into
  # the runner's Docker; then scripts/docker-smoke.sh boots it on empty content
  # and data volumes, waits for /healthz to answer 200 and checks the home page
  # is the seeded starter site in the packaged default theme.
  #
  # This job pushes nothing: `push: false`, no registry login, and the token
  # stays at `contents: read`. The layer cache is the buildx GitHub Actions
  # cache, which lives in the Actions cache rather than in any registry.
  #
  # An amd64 runner, unlike the arm64 runners above, because amd64 is the
  # platform checked here and building it on arm64 would mean QEMU emulation.
  # Node and pnpm are not installed: the build happens inside the Dockerfile,
  # and the script needs only bash, curl and docker.
  docker-smoke:
    name: docker-smoke
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image for linux/amd64 without pushing it
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: geekity-smoke:ci
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,mode=max,scope=docker-smoke
      - name: Boot it on empty volumes and check /healthz and the home page
        shell: bash
        run: bash scripts/docker-smoke.sh geekity-smoke:ci

  record-tested-tree:
    name: record-tested-tree
    if: github.event_name == 'pull_request'
    needs:
      [lint, typecheck, test, test-node-26, build, test-11ty, fed-smoke, pack-install, docker-smoke]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - id: tree
        shell: bash
        run: |
          git rev-parse 'HEAD^{tree}' > tested-tree.txt
          echo "tree=$(cat tested-tree.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 30
