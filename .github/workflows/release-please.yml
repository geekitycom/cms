# Releasing @geekity/cms and the plugin packages (decision-7, decision-33).
#
# Runs on every push to `main` and keeps one release pull request open for
# every package with releasable changes, each package's version and
# CHANGELOG.md derived from the Conventional Commits that have landed since its
# last release. Merging that pull request tags each released package and
# creates its GitHub release.
#
# Publishing is deliberately not automated: a maintainer runs `pnpm release`
# on main when they choose to. See "Publishing a release" in README.md.
#
# `apps/demo` is private and unversioned, so `release-please-config.json` tracks
# `packages/cms` and each `packages/plugin-*`. A plugin package is versioned on
# its own and tagged with its component, as `plugin-wordpress-v0.1.0`, while
# @geekity/cms keeps its plain `v0.x.y` tags.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# Releases are not cancellable: a half-run release is worse than a queued one.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # The default GITHUB_TOKEN cannot trigger other workflows, so a
          # release pull request opened with it gets no CI. Add a
          # `RELEASE_PLEASE_TOKEN` repository secret holding a fine-grained PAT
          # with contents and pull-requests write to get the checks back; the
          # release itself works either way.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
