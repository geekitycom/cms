# Releasing @geekity/cms (decision-7).
#
# Runs on every push to `main` and keeps a release pull request open, its
# version and CHANGELOG.md derived from the Conventional Commits that have
# landed since the last release. Merging that pull request tags the commit and
# creates the GitHub release.
#
# Publishing to npm is deliberately not automated: a maintainer runs
# `pnpm publish` from the tagged checkout when they choose to. See "Publishing
# to npm" in README.md.
#
# `apps/demo` is private and unversioned, so `release-please-config.json` tracks
# `packages/cms` and nothing else.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# Releases are not cancellable: a half-run release is worse than a queued one.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # The default GITHUB_TOKEN cannot trigger other workflows, so a
          # release pull request opened with it gets no CI. Add a
          # `RELEASE_PLEASE_TOKEN` repository secret holding a fine-grained PAT
          # with contents and pull-requests write to get the checks back; the
          # release itself works either way.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
