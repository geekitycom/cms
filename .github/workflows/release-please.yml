# Releasing @geekity/cms and the plugin packages (decision-7, decision-33,
# decision-58).
#
# Runs on every push to `main` and keeps one release pull request open for
# every package with releasable changes, each package's version and
# CHANGELOG.md derived from the Conventional Commits that have landed since its
# last release. Merging that pull request tags each released package and
# creates its GitHub release.
#
# A created release then starts the publish job, which runs `pnpm release` in
# the `release` environment. A manual run of this workflow goes straight to the
# publish job, to retry one. See "Publishing a release" in
# docs/development.md.
#
# `apps/demo` is private and unversioned, so `release-please-config.json` tracks
# `packages/cms` and each `packages/plugin-*`. A plugin package is versioned on
# its own and tagged with its component, as `plugin-wordpress-v0.1.0`, while
# @geekity/cms keeps its plain `v0.x.y` tags.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases are not cancellable: a half-run release is worse than a queued one.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # The default GITHUB_TOKEN cannot trigger other workflows, so a
          # release pull request opened with it gets no CI. Add a
          # `RELEASE_PLEASE_TOKEN` repository secret holding a fine-grained PAT
          # with contents and pull-requests write to get the checks back; the
          # release itself works either way.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A dispatch skips release-please, so `!cancelled()` lets this job run after a
  # skipped dependency.
  publish:
    name: publish
    needs: release-please
    if: >-
      ${{ !cancelled() && (needs.release-please.outputs.releases_created == 'true'
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm release
